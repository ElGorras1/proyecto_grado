name: Verificación del sistema
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET_KEY: clave-solo-para-pruebas-aisladas-en-ci-2026
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements/*.txt'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip check
      - run: python -m ruff check app scripts/auditar_sistema.py --select F
      - run: python -m pytest tests -q
      - run: python -m pip_audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --quiet
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npm audit --audit-level=high
